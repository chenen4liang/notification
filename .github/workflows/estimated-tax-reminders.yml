name: Estimated Tax Payment Reminders

on:
  schedule:
    # Q1 reminder: April 1st (14 days before April 15th)
    - cron: '0 9 1 4 *'
    # Q2 reminder: June 1st (14 days before June 15th)
    - cron: '0 9 1 6 *'
    # Q3 reminder: September 1st (14 days before September 15th)
    - cron: '0 9 1 9 *'
    # Q4 reminder: January 1st (14 days before January 15th)
    - cron: '0 9 1 1 *'
  workflow_dispatch:  # Allow manual trigger for testing

jobs:
  send-estimated-tax-reminder:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Determine which quarter
      id: quarter
      run: |
        MONTH=$(date +%m)
        YEAR=$(date +%Y)
        
        case $MONTH in
          04)
            echo "quarter=Q1" >> $GITHUB_OUTPUT
            echo "period=January 1 - March 31" >> $GITHUB_OUTPUT
            echo "due_date=April 15th" >> $GITHUB_OUTPUT
            echo "tax_year=$YEAR" >> $GITHUB_OUTPUT
            ;;
          06)
            echo "quarter=Q2" >> $GITHUB_OUTPUT
            echo "period=April 1 - May 31" >> $GITHUB_OUTPUT
            echo "due_date=June 15th" >> $GITHUB_OUTPUT
            echo "tax_year=$YEAR" >> $GITHUB_OUTPUT
            ;;
          09)
            echo "quarter=Q3" >> $GITHUB_OUTPUT
            echo "period=June 1 - August 31" >> $GITHUB_OUTPUT
            echo "due_date=September 15th" >> $GITHUB_OUTPUT
            echo "tax_year=$YEAR" >> $GITHUB_OUTPUT
            ;;
          01)
            echo "quarter=Q4" >> $GITHUB_OUTPUT
            echo "period=September 1 - December 31" >> $GITHUB_OUTPUT
            echo "due_date=January 15th" >> $GITHUB_OUTPUT
            echo "tax_year=$((YEAR-1))" >> $GITHUB_OUTPUT
            ;;
        esac
    
    - name: Send estimated tax reminder
      env:
        discordChannel: ${{ secrets.DISCORD_WEBHOOK }}
        QUARTER: ${{ steps.quarter.outputs.quarter }}
        DUE_DATE: ${{ steps.quarter.outputs.due_date }}
        TAX_YEAR: ${{ steps.quarter.outputs.tax_year }}
        PERIOD: ${{ steps.quarter.outputs.period }}
      run: |
        python send_discord_notification.py $'💰 **Estimated Tax Payment Reminder**\n\n⏰ **2 WEEKS until '"${QUARTER}"' payment is due!**\n\n📅 **Due Date:** '"${DUE_DATE}"'\n📊 **Quarter:** '"${QUARTER}"' '"${TAX_YEAR}"'\n📆 **Period:** '"${PERIOD}"'\n\n💡 **Remember:**\n• This covers both Federal and State estimated taxes\n• Payment due even if you haven'\''t calculated exact amount\n• Can pay online at:\n  - Federal: https://www.irs.gov/payments\n  - State: Check your state tax website\n\n⚠️ **Note:** If the 15th falls on a weekend/holiday, the due date is the next business day.\n\nSet a reminder to make your payment!'