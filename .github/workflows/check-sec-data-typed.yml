name: SEC Monitor with Notification Types

on:
  schedule:
    - cron: '0 * * * *'  # Hourly
  workflow_dispatch:
    inputs:
      notification_type:
        description: 'Notification type to send'
        type: choice
        options:
          - data_available
          - data_updated
          - reminder
          - test
        default: data_available
      force_notify:
        description: 'Force notification even if already sent'
        type: boolean
        default: false

jobs:
  check-sec-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Restore notification history
      uses: actions/cache@v4
      with:
        path: .notification_history
        key: notifications-typed-v1
        restore-keys: notifications-typed-
    
    - name: Check and notify with type tracking
      env:
        discordChannel: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        mkdir -p .notification_history
        MONTH="2025-07"
        
        # Determine notification type
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          NOTIFICATION_TYPE="${{ inputs.notification_type }}"
          FORCE_NOTIFY="${{ inputs.force_notify }}"
        else
          NOTIFICATION_TYPE="data_available"
          FORCE_NOTIFY="false"
        fi
        
        # History file for this specific notification type and month
        HISTORY_FILE=".notification_history/${MONTH}-${NOTIFICATION_TYPE}"
        
        echo "=== SEC Check Started at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ===" | tee check.log
        echo "Month: ${MONTH}" | tee -a check.log
        echo "Notification Type: ${NOTIFICATION_TYPE}" | tee -a check.log
        
        # Check if data is available
        DATA_AVAILABLE=$(python check_sec.py ${MONTH})
        echo "Data available: ${DATA_AVAILABLE}" | tee -a check.log
        
        if [ "${DATA_AVAILABLE}" = "true" ]; then
          echo "✅ Data is available for ${MONTH}" | tee -a check.log
          
          # Check if we already sent THIS TYPE of notification
          if [ -f "${HISTORY_FILE}" ] && [ "${FORCE_NOTIFY}" != "true" ]; then
            LAST_SENT=$(cat "${HISTORY_FILE}")
            echo "📌 Already sent '${NOTIFICATION_TYPE}' notification on ${LAST_SENT}" | tee -a check.log
            echo "Skipping notification (use different type or force to override)" | tee -a check.log
          else
            echo "📤 Sending '${NOTIFICATION_TYPE}' notification..." | tee -a check.log
            
            # Send notification with specific type
            cat > notify.py << 'EOF'
import sys
import os
sys.path.append(os.path.dirname(os.path.abspath(__file__)))
from check_and_notify import check_and_notify

month = "${MONTH}"
notification_type = "${NOTIFICATION_TYPE}"

# Call the function with notification type
has_data, sent = check_and_notify(month, silent=False, notify_only_if_available=True, notification_type=notification_type)

# Exit with appropriate code
sys.exit(0 if sent else 1)
EOF
            
            # Replace variables in the Python script
            sed -i "s/\${MONTH}/${MONTH}/g" notify.py
            sed -i "s/\${NOTIFICATION_TYPE}/${NOTIFICATION_TYPE}/g" notify.py
            
            if python notify.py; then
              # Record that we sent this type of notification
              date -u '+%Y-%m-%d %H:%M:%S UTC' > "${HISTORY_FILE}"
              echo "✅ '${NOTIFICATION_TYPE}' notification sent and recorded!" | tee -a check.log
            else
              echo "❌ Failed to send notification" | tee -a check.log
            fi
          fi
        else
          echo "❌ No data available for ${MONTH} yet" | tee -a check.log
          # Optionally reset specific notification types when data disappears
          # rm -f "${HISTORY_FILE}"
        fi
        
        echo -e "\n📋 Notification History for ${MONTH}:" | tee -a check.log
        for file in .notification_history/${MONTH}-*; do
          if [ -f "$file" ]; then
            TYPE=$(basename "$file" | cut -d'-' -f3-)
            SENT_TIME=$(cat "$file")
            echo "  - ${TYPE}: sent on ${SENT_TIME}" | tee -a check.log
          fi
        done
        
        # Show what notification types are still available
        echo -e "\n💡 Available notification types for ${MONTH}:" | tee -a check.log
        for type in data_available data_updated reminder; do
          if [ ! -f ".notification_history/${MONTH}-${type}" ]; then
            echo "  - ${type} (not sent yet)" | tee -a check.log
          fi
        done
        
        echo "=== SEC Check Completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC') ===" | tee -a check.log
    
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sec-check-log-${{ github.run_number }}
        path: |
          check.log
          .notification_history/
        retention-days: 30